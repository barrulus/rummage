# Français translation of rummage.
# English keys and format fields must match the source exactly.
# See docs/translations.md; validate with scripts/i18n-check.py --strict.

[language]
name = "Français"
decimal_separator = ","

# Integer cardinal rules from Unicode CLDR (whole, nonnegative counts).
[language.plural_rules]
one = "n = 0..1"
many = "n != 0 and n % 1000000 = 0"

# Key labels only; shortcut bindings keep their original spelling.
[keys]
Shift = "Maj"
Space = "Espace"
Delete = "Suppr"
Backspace = "Retour arrière"
Enter = "Entrée"
