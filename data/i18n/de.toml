"Access was denied. Check that the archive is readable and choose a writable destination." = "Zugriff verweigert. Prüfen, ob das Archiv lesbar ist, und ein beschreibbares Ziel wählen."
"The extractor could not create or write output. Check destination permissions and free disk space." = "Das Entpackprogramm konnte nichts schreiben. Zielrechte und freien Speicherplatz prüfen."
"An archive part is missing. Put all parts in the same folder and open the first part with an archive manager." = "Ein Archivteil fehlt. Alle Teile in denselben Ordner legen und den ersten Teil mit einer Archivverwaltung öffnen."
"The archive may be damaged, or this extractor may lack RAR support." = "Das Archiv ist evtl. beschädigt, oder dem Entpackprogramm fehlt RAR-Unterstützung."
"The archive is damaged, incomplete, or not in the expected format. Obtain a fresh copy and make sure all archive parts are present." = "Das Archiv ist beschädigt, unvollständig oder hat ein unerwartetes Format. Neue Kopie besorgen und prüfen, ob alle Teile da sind."
"The extractor was interrupted before completion. Retry if you did not intend to cancel extraction." = "Das Entpacken wurde unterbrochen. Erneut versuchen, falls das nicht gewollt war."
"The extractor ran out of memory. Close other applications or use a machine with more available memory." = "Dem Entpackprogramm ging der Speicher aus. Andere Programme schließen oder einen Rechner mit mehr Speicher nutzen."
"The extractor could not complete the operation. Check the details below, the archive's integrity, and destination permissions; then retry or use another extractor." = "Das Entpacken ist gescheitert. Details unten, Archiv und Zielrechte prüfen; dann erneut versuchen oder ein anderes Entpackprogramm nutzen."

