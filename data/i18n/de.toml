# German translation of rummage.
#
# [texts] maps the English text, as the code writes it, to its translation. Fields ("{}")
# stay in the same order unless the translation numbers them ("{1} von {0}"); a translation
# whose fields do not fit falls back to English. Texts that are missing stay English.
# docs/translations.md explains how to add a language; scripts/i18n-check.py lists texts
# that are missing here and entries the code no longer uses.

[language]
name = "Deutsch"
decimal_separator = ","

[language.plural_rules]
one = "n = 1"

# Key names in shortcuts, as German keyboards label them.
[keys]
Ctrl = "Strg"
Shift = "Umschalt"
