name: Build, test and package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tumbleweed_only:
        description: Test only Tumbleweed (no development downloads)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let main finish publishing before another main run can replace its assets.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  reuse:
    name: Find validated PR build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      commit: ${{ steps.find.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/reuse-build.py

  nix:
    name: Nix build, tests and installed package
    needs: reuse
    if: inputs.tumbleweed_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Restore previous fork PR builds
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'nix/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-prefixes-first-match: nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'nix/**') }}-
      - name: Cache completed builds as they finish
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: rummage-fm
          authToken: ${{ github.repository == 'barrulus/rummage' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.repository != 'barrulus/rummage' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
      - name: Download the validated PR Nix closure
        if: needs.reuse.outputs.run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nix-store-${{ needs.reuse.outputs.commit }}
          run-id: ${{ needs.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nix-cache
      - name: Restore the identical-tree Nix build
        if: needs.reuse.outputs.run_id != ''
        run: python3 scripts/ci/nix-cache.py restore "$RUNNER_TEMP/nix-cache"
      - name: Lint workflow, scripts and documentation; test CI tooling
        run: python3 scripts/ci/preflight.py lint
      - name: Run all x86_64-linux flake checks and build all package variants
        run: python3 scripts/ci/preflight.py nix
      - name: Export validated Nix outputs for merge
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/nix-cache.py export "$RUNNER_TEMP/nix-cache"
      - name: Retain validated Nix outputs
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nix-store-${{ github.sha }}
          path: ${{ runner.temp }}/nix-cache/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload checked Nix packages to Cachix
        if: >-
          github.repository == 'barrulus/rummage' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        # Imported paths don't invoke the post-build hook; publish them explicitly.
        run: python3 scripts/ci/nix-cache.py push
      - name: Save completed fork PR builds even if a later test failed
        if: >-
          !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'nix/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

  void:
    name: Void glibc package and clean install
    needs: reuse
    if: needs.reuse.outputs.run_id == '' && inputs.tumbleweed_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Build exact checkout and test in a fresh Void container
        env:
          CI_JOBS: 2
          PACKAGE_OUTPUT: ${{ runner.temp }}/void-package
        run: |
          set -o pipefail
          bash scripts/ci/void.sh "$PACKAGE_OUTPUT" 2>&1 | tee "$RUNNER_TEMP/void-package.log"
      - name: Save package, source identity and build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: void-x86_64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/void-package/packages/
            ${{ runner.temp }}/void-package/template
            ${{ runner.temp }}/void-package/source.json
            ${{ runner.temp }}/void-package.log
          retention-days: 14
          if-no-files-found: error

  native:
    name: ${{ matrix.distro }} package and clean install
    needs: reuse
    if: needs.reuse.outputs.run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.tumbleweed_only == true && '[{"format":"tumbleweed","distro":"openSUSE Tumbleweed"}]' || '[{"format":"deb","distro":"Debian 13"},{"format":"rpm","distro":"Fedora 44"},{"format":"arch","distro":"Arch Linux"},{"format":"tumbleweed","distro":"openSUSE Tumbleweed"}]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Build exact checkout and test in a fresh distro container
        env:
          CI_JOBS: 2
          PACKAGE_FORMAT: ${{ matrix.format }}
          PACKAGE_OUTPUT: ${{ runner.temp }}/native-package
        run: |
          set -o pipefail
          bash scripts/ci/native.sh "$PACKAGE_FORMAT" "$PACKAGE_OUTPUT" 2>&1 | tee "$RUNNER_TEMP/native-package.log"
      - name: Save packages, recipes, source identity and build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.format }}-x86_64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-package/packages/
            ${{ runner.temp }}/native-package/recipe/
            ${{ runner.temp }}/native-package/debian-source/
            ${{ runner.temp }}/native-package/rummage.spec
            ${{ runner.temp }}/native-package/input/
            ${{ runner.temp }}/native-package.log
          retention-days: 14
          if-no-files-found: error

  downloads:
    name: Prepare development downloads
    needs: [reuse, nix, void, native]
    if: >-
      !cancelled() && inputs.tumbleweed_only != true && needs.nix.result == 'success' &&
      ((needs.reuse.outputs.run_id != '' && needs.void.result == 'skipped' && needs.native.result == 'skipped') ||
       (needs.reuse.outputs.run_id == '' && needs.void.result == 'success' && needs.native.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.reuse.outputs.run_id == ''
        with:
          pattern: '*-x86_64-${{ github.sha }}'
          path: ${{ runner.temp }}/package-artifacts
      - name: Prepare checked packages and instructions
        if: needs.reuse.outputs.run_id == ''
        run: |
          python3 scripts/ci/prepare-downloads.py "$RUNNER_TEMP/package-artifacts" "$RUNNER_TEMP/downloads" \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
      - name: Download already validated PR packages
        if: needs.reuse.outputs.run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: development-downloads-${{ needs.reuse.outputs.commit }}
          run-id: ${{ needs.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/downloads
      - name: Verify and promote packages from the identical source tree
        if: needs.reuse.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_COMMIT: ${{ needs.reuse.outputs.commit }}
        run: |
          python3 scripts/ci/promote-downloads.py "$RUNNER_TEMP/downloads" \
            --tested-commit "$TESTED_COMMIT" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-downloads-${{ github.sha }}
          path: ${{ runner.temp }}/downloads/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish development downloads
    needs: downloads
    if: >-
      !cancelled() && needs.downloads.result == 'success' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: development-downloads-${{ github.sha }}
          path: ${{ runner.temp }}/downloads
      - name: Update rolling development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci/publish-downloads.sh "$RUNNER_TEMP/downloads" "$GITHUB_SHA"
